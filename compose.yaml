name: weharbor
services:
  weharbor:
    image: ${WEHARBOR_IMAGE:-weharbor:0.1.0}
    platform: linux/amd64
    restart: unless-stopped
    shm_size: ${SHM_SIZE:-1gb}
    # Chromium singleton sockets require normal private-directory permissions.
    # NAS ACL inheritance on the image filesystem can override mkdir(0700).
    tmpfs:
      - /tmp:rw,exec,mode=1777,size=1g
    volumes:
      - ${DATA_DIR:-./data}:/config
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-3000}:3000"
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-3001}:3001"
    # Chat analysis reads the database key from the WeChat process.
    cap_add:
      - SYS_PTRACE
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Asia/Shanghai}
      LC_ALL: zh_CN.UTF-8
      CUSTOM_USER: ${CUSTOM_USER:-weharbor}
      PASSWORD: ${PASSWORD:?Run scripts/init.sh or set PASSWORD in .env}
      AUTO_START_WECHAT: ${AUTO_START_WECHAT:-true}
      AUTO_START_QQ: "false"
      ENABLE_APP_SWITCHER: ${ENABLE_APP_SWITCHER:-true}
      APP_SWITCHER_MODE: ${APP_SWITCHER_MODE:-web}
      ENABLE_WINDOW_DEFAULTS: ${ENABLE_WINDOW_DEFAULTS:-true}
      ENABLE_BROWSER_NOTIFICATIONS: ${ENABLE_BROWSER_NOTIFICATIONS:-true}
      ENABLE_MAGPIE: ${ENABLE_MAGPIE:-true}
      SELKIES_ENABLE_BINARY_CLIPBOARD: ${SELKIES_ENABLE_BINARY_CLIPBOARD:-true}
      # Optional remote access; all off by default. Empty = not set (the web UI
      # under 连接 can configure them instead). See docs/remote-access.md.
      TAILSCALE_ENABLE: ${TAILSCALE_ENABLE:-}
      TAILSCALE_AUTHKEY: ${TAILSCALE_AUTHKEY:-}
      TAILSCALE_HOSTNAME: ${TAILSCALE_HOSTNAME:-}
      TAILSCALE_LOGIN_SERVER: ${TAILSCALE_LOGIN_SERVER:-}
      TAILSCALE_SERVE: ${TAILSCALE_SERVE:-}
      TAILSCALE_EXTRA_ARGS: ${TAILSCALE_EXTRA_ARGS:-}
      CLOUDFLARE_TUNNEL_ENABLE: ${CLOUDFLARE_TUNNEL_ENABLE:-}
      CLOUDFLARE_TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
      FRP_ENABLE: ${FRP_ENABLE:-}
      FRP_MODE: ${FRP_MODE:-}
      FRP_SERVER_ADDR: ${FRP_SERVER_ADDR:-}
      FRP_SERVER_PORT: ${FRP_SERVER_PORT:-}
      FRP_TOKEN: ${FRP_TOKEN:-}
      FRP_PROXY_TYPE: ${FRP_PROXY_TYPE:-}
      FRP_REMOTE_PORT: ${FRP_REMOTE_PORT:-}
      FRP_CUSTOM_DOMAIN: ${FRP_CUSTOM_DOMAIN:-}
      FRP_PROXY_NAME: ${FRP_PROXY_NAME:-}
      FRP_TLS: ${FRP_TLS:-}
