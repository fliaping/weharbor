name: weharbor
services:
  weharbor:
    image: ${WEHARBOR_IMAGE:-weharbor:0.1.0}
    platform: linux/amd64
    restart: unless-stopped
    shm_size: ${SHM_SIZE:-1gb}
    volumes:
      - ${DATA_DIR:-./data}:/config
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-3000}:3000"
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-3001}:3001"
      - "${API_BIND_ADDRESS:-127.0.0.1}:${WEFLOW_API_PORT:-5031}:${WEFLOW_API_PORT:-5031}"
    cap_add:
      - SYS_PTRACE
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Asia/Shanghai}
      LC_ALL: zh_CN.UTF-8
      CUSTOM_USER: ${CUSTOM_USER:-weharbor}
      PASSWORD: ${PASSWORD:?Run scripts/init.sh or set PASSWORD in .env}
      AUTO_START_WECHAT: ${AUTO_START_WECHAT:-true}
      AUTO_START_WEFLOW: ${AUTO_START_WEFLOW:-true}
      AUTO_START_QQ: "false"
      ENABLE_APP_SWITCHER: ${ENABLE_APP_SWITCHER:-true}
      ENABLE_BROWSER_NOTIFICATIONS: ${ENABLE_BROWSER_NOTIFICATIONS:-true}
      SELKIES_ENABLE_BINARY_CLIPBOARD: ${SELKIES_ENABLE_BINARY_CLIPBOARD:-true}
      ENABLE_WECHAT_AUTO_LOGIN: ${ENABLE_WECHAT_AUTO_LOGIN:-true}
      AUTO_LOGIN_DELAY: ${AUTO_LOGIN_DELAY:-3}
      ENABLE_WECHAT_NIGHTLY_RESTART: ${ENABLE_WECHAT_NIGHTLY_RESTART:-false}
      WECHAT_NIGHTLY_STOP_TIME: ${WECHAT_NIGHTLY_STOP_TIME:-23:30}
      WECHAT_NIGHTLY_START_TIME: ${WECHAT_NIGHTLY_START_TIME:-01:30}
