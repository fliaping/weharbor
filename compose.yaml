name: weharbor
services:
  weharbor:
    image: ${WEHARBOR_IMAGE:-weharbor:0.1.0}
    platform: linux/amd64
    restart: unless-stopped
    shm_size: ${SHM_SIZE:-1gb}
    # Chromium singleton sockets require normal private-directory permissions.
    # NAS ACL inheritance on the image filesystem can override mkdir(0700).
    tmpfs:
      - /tmp:rw,exec,mode=1777,size=1g
    volumes:
      - ${DATA_DIR:-./data}:/config
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-3000}:3000"
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-3001}:3001"
      # Alpha binds 127.0.0.1:5031 inside the container; nginx republishes it on 5032.
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-5031}:5032"
    cap_add:
      - SYS_PTRACE
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Asia/Shanghai}
      LC_ALL: zh_CN.UTF-8
      CUSTOM_USER: ${CUSTOM_USER:-weharbor}
      PASSWORD: ${PASSWORD:?Run scripts/init.sh or set PASSWORD in .env}
      AUTO_START_WECHAT: ${AUTO_START_WECHAT:-true}
      AUTO_START_ALPHA: ${AUTO_START_ALPHA:-true}
      AUTO_START_QQ: "false"
      ENABLE_APP_SWITCHER: ${ENABLE_APP_SWITCHER:-true}
      APP_SWITCHER_MODE: ${APP_SWITCHER_MODE:-web}
      ENABLE_WINDOW_DEFAULTS: ${ENABLE_WINDOW_DEFAULTS:-true}
      ENABLE_BROWSER_NOTIFICATIONS: ${ENABLE_BROWSER_NOTIFICATIONS:-true}
      ENABLE_MAGPIE: ${ENABLE_MAGPIE:-true}
      SELKIES_ENABLE_BINARY_CLIPBOARD: ${SELKIES_ENABLE_BINARY_CLIPBOARD:-true}
