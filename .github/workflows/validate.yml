name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source and test asset handling
        run: python3 scripts/check.py
      - name: Validate Compose
        env:
          PASSWORD: validation-only
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose --env-file .env.example -f compose.yaml -f compose.build.yaml config --quiet
          docker compose --env-file .env.example -f compose.yaml -f compose.gpu.yaml config --quiet
