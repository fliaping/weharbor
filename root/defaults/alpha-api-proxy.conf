server {
  listen ALPHA_API_PROXY_PORT;
  listen [::]:ALPHA_API_PROXY_PORT;
  location / {
    if ($http_origin) {
      return 403;
    }
    proxy_pass              http://127.0.0.1:ALPHA_API_PORT;
    proxy_set_header        Host 127.0.0.1:ALPHA_API_PORT;
    proxy_set_header        Connection "";
    proxy_http_version      1.1;
    proxy_buffering         off;
    proxy_cache             off;
    proxy_request_buffering off;
    proxy_read_timeout      3600s;
    proxy_send_timeout      3600s;
    proxy_connect_timeout   5s;
    client_max_body_size    16m;
  }
}
