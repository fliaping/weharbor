location /analysis/ {
  proxy_pass http://127.0.0.1:10392/;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 660s;
  proxy_buffering off;
}
location /assistant/ {
  proxy_pass http://127.0.0.1:3080;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $http_connection;
  proxy_set_header Host $http_host;
  proxy_read_timeout 3600s;
  proxy_buffering off;
}
location = /workspace/mcp {
  auth_basic off;
  proxy_pass http://127.0.0.1:8766/mcp;
  proxy_set_header Host $http_host;
  proxy_set_header X-WeHarbor-Browser "";
  proxy_read_timeout 660s;
  proxy_buffering off;
}
location /workspace/data/ {
  auth_basic off;
  proxy_pass http://127.0.0.1:8766/data/;
  proxy_set_header Host $http_host;
  proxy_set_header X-WeHarbor-Browser "";
}
location /workspace/skill/ {
  auth_basic off;
  proxy_pass http://127.0.0.1:8766/skill/;
  proxy_set_header Host $http_host;
  proxy_set_header X-WeHarbor-Browser authenticated;
}
location /workspace/ {
  proxy_pass http://127.0.0.1:8766/;
  proxy_set_header Host $http_host;
  proxy_set_header X-WeHarbor-Browser authenticated;
  proxy_read_timeout 660s;
}
location = /logo.png {
  proxy_pass http://127.0.0.1:10392/logo.png;
}
